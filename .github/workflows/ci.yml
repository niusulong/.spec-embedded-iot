name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # knowledge-archiver 测试套件自包含（用临时 KNOWLEDGE_ROOT），本地 57 passed 稳定。
      # 暂不纳入 CI 的两项（待后续解决）：
      #   - test_pcap_analyzer：pre-existing scapy 兼容失败（4 fail + 9 error），需单独修。
      #   - kb.py wiki lint：依赖 knowledge 子仓库（私有，CI 默认 token 无权跨仓库拉取），
      #     需配置 PAT secret 后再加，或改为跑测试 fixture。
      - name: Run knowledge-archiver tests
        run: |
          cd skills/spec-knowledge-archiver/scripts
          # test_keyword_recall 依赖真实 knowledge/wiki/INDEX.md（私有子仓库，CI 无权拉取）；
          # 本地有 knowledge 时跑，CI 用 --deselect 跳过。其余 56 项自包含。
          pytest test_archiver.py test_wiki.py test_e2e_retrieval.py test_e2e_agent_flow.py -v \
            --deselect test_e2e_retrieval.py::test_keyword_recall
